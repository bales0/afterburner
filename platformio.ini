; Afterburner v0.6.3 – multi-board builds (the hardware shield must match).
; Run: pio run                        -> AVR targets
;      pio run -e uno_r4_minima       -> R4 experimental
;      pio run -e esp32s2_saola1     -> ESP32-S2 experimental, NOT 5V tolerant
;      powershell -File scripts/build_all_firmware.ps1 -IncludeExperimental
[platformio]
src_dir = src
default_envs = uno, nano, mega2560, leonardo, micro, yun

[env]
framework = arduino
monitor_speed = 57600
build_flags = -I.
lib_ldf_mode = deep+
extra_scripts = pre:scripts/pio_compat_pre.py

[env:uno]
platform = atmelavr
board = uno

[env:nano]
platform = atmelavr
board = nanoatmega328
; For older Nano bootloaders, upload_speed may need 57600.

[env:mega2560]
platform = atmelavr
board = megaatmega2560

[env:leonardo]
platform = atmelavr
board = leonardo
; 32U4 build: GAL600x/JTAG/Exerciser disabled by default (flash/SRAM).

[env:micro]
platform = atmelavr
board = micro

[env:yun]
platform = atmelavr
board = yun

; Build configurations only. Do not upload or connect shield without checks
; of analog reference, VPP voltage, reset, GPIO voltage and pin mappings.
[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
build_src_flags = -include aftb_platform_compat.h

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
build_src_flags = -include aftb_platform_compat.h

[env:esp32s2_saola1]
platform = espressif32
board = esp32-s2-saola-1
build_src_flags = -include aftb_platform_compat.h
; ESP32-S2 GPIO IS NOT 5V TOLERANT: hardware level shifting REQUIRED.
