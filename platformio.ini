; Afterburner (bales0/afterburner) — Arduino firmware
; Place this file in the root of the firmware repository,
; alongside afterburner.ino and aftb_*.h.
; The Avalonia PC application is built separately with dotnet.

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino

monitor_speed = 57600
upload_protocol = arduino

build_flags =
    -I.

lib_ldf_mode = deep+